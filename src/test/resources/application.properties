spring.datasource.url=jdbc:h2:mem:aicoach;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.task.scheduling.enabled=false
garmin.bot.url=http://localhost:8000
garmin.security.encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
garmin.sync.initial-delay-ms=3600000
garmin.sync.max-attempts=1
garmin.sync.retry-delay-ms=0
garmin.delivery.max-attempts=1
garmin.delivery.retry-delay-ms=0
