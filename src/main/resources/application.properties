# Servidor
server.port=${SERVER_PORT:8080}
spring.application.name=backend

# MySQL. Segredos devem ser fornecidos pelo ambiente, nunca versionados.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_coach_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Integração Garmin
garmin.bot.url=${GARMIN_BOT_URL:http://localhost:8000}
garmin.security.encryption-key=${GARMIN_ENCRYPTION_KEY}
garmin.sync.fixed-delay-ms=${GARMIN_SYNC_FIXED_DELAY_MS:60000}
garmin.sync.initial-delay-ms=${GARMIN_SYNC_INITIAL_DELAY_MS:60000}

# OpenAI Responses API
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1}
openai.api.key=${OPENAI_API_KEY:}
openai.model.planner=${OPENAI_MODEL_PLANNER:gpt-5-mini}
openai.model.weekly-planner=${OPENAI_MODEL_WEEKLY_PLANNER:gpt-5-mini}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:8000}
openai.weekly.max-output-tokens=${OPENAI_WEEKLY_MAX_OUTPUT_TOKENS:12000}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:60}
openai.max-retries=${OPENAI_MAX_RETRIES:2}
