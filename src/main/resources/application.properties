# Servidor
server.port=${SERVER_PORT:8080}
spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# MySQL. Segredos devem ser fornecidos pelo ambiente, nunca versionados.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_coach_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Integração Garmin
garmin.bot.url=${GARMIN_BOT_URL:http://localhost:8000}
garmin.security.encryption-key=${GARMIN_ENCRYPTION_KEY}
garmin.sync.fixed-delay-ms=${GARMIN_SYNC_FIXED_DELAY_MS:7200000}
garmin.sync.initial-delay-ms=${GARMIN_SYNC_INITIAL_DELAY_MS:7200000}
garmin.sync.discovery-limit=${GARMIN_SYNC_DISCOVERY_LIMIT:100}
garmin.sync.recovery-window-hours=${GARMIN_SYNC_RECOVERY_WINDOW_HOURS:24}
garmin.sync.max-attempts=${GARMIN_SYNC_MAX_ATTEMPTS:3}
garmin.sync.retry-delay-ms=${GARMIN_SYNC_RETRY_DELAY_MS:500}
garmin.sync.connect-timeout-ms=${GARMIN_SYNC_CONNECT_TIMEOUT_MS:3000}
garmin.sync.read-timeout-ms=${GARMIN_SYNC_READ_TIMEOUT_MS:60000}
garmin.delivery.max-attempts=${GARMIN_DELIVERY_MAX_ATTEMPTS:3}
garmin.delivery.retry-delay-ms=${GARMIN_DELIVERY_RETRY_DELAY_MS:200}
garmin.delivery.connect-timeout-ms=${GARMIN_DELIVERY_CONNECT_TIMEOUT_MS:3000}
garmin.delivery.read-timeout-ms=${GARMIN_DELIVERY_READ_TIMEOUT_MS:30000}
garmin.delivery.adapter-api-key=${GARMIN_ADAPTER_API_KEY:}

# OpenAI Responses API
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1}
openai.api.key=${OPENAI_API_KEY:}
openai.model.planner=${OPENAI_MODEL_PLANNER:gpt-5-mini}
openai.model.weekly-planner=${OPENAI_MODEL_WEEKLY_PLANNER:gpt-5-mini}
openai.model.activity-review=${OPENAI_MODEL_ACTIVITY_REVIEW:gpt-5-mini}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:8000}
openai.weekly.max-output-tokens=${OPENAI_WEEKLY_MAX_OUTPUT_TOKENS:12000}
openai.activity-review.max-output-tokens=${OPENAI_ACTIVITY_REVIEW_MAX_OUTPUT_TOKENS:2500}
openai.activity-review.max-inspections=${OPENAI_ACTIVITY_REVIEW_MAX_INSPECTIONS:4}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:60}
openai.max-retries=${OPENAI_MAX_RETRIES:2}
