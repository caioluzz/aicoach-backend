# Configuração do Servidor
server.port=8080
spring.application.name=backend

# Conexão com o Banco de Dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ai_coach_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuração do Flyway (Nossas migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# URL Robo
garmin.bot.url=http://localhost:8000

#Encrypt key
garmin.security.encryption-key=Qn3yAMEwIkexpw566tkJ1JAuOeCK7jG6mZlFf7aRrNI=
