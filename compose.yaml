services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_coach_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD antes de iniciar o MySQL}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - aicoach-mysql:/var/lib/mysql

volumes:
  aicoach-mysql:
